name: Build CTDM for macOS

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/macos-build.yml'
      - 'lib/**'
      - 'macos/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctdm-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          uname -m

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Locate and verify app bundle
        id: app
        run: |
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/Contents/Info.plist"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist"
          file "$APP_PATH"/Contents/MacOS/*

      - name: Package app
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" CTDM-macOS-arm64.zip
          shasum -a 256 CTDM-macOS-arm64.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: CTDM-macOS-arm64
          path: CTDM-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14
