name: Build CTDM for macOS

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/macos-build.yml'
      - 'lib/**'
      - 'macos/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ctdm-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          xcodebuild -version
          uname -m

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release -t lib/studio_main.dart

      - name: Locate and verify app bundle
        id: app
        run: |
          APP_DIR="build/macos/Build/Products/Release"
          SOURCE_APP="$(find "$APP_DIR" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$SOURCE_APP"
          APP_PATH="$APP_DIR/MKW Distribution Maker.app"
          if [ "$SOURCE_APP" != "$APP_PATH" ]; then mv "$SOURCE_APP" "$APP_PATH"; fi
          test -f "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleName "MKW Distribution Maker"' "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName "MKW Distribution Maker"' "$APP_PATH/Contents/Info.plist" || /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string "MKW Distribution Maker"' "$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :CFBundleIdentifier com.nvdemu.mkwdistributionmaker' "$APP_PATH/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP_PATH/Contents/Info.plist")" = "MKW Distribution Maker"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist"
          file "$APP_PATH"/Contents/MacOS/*

      - name: Bundle Wiimm and media tools inside app
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          set -euo pipefail
          TOOL_ROOT="$APP_PATH/Contents/Resources/CTDM-tools"
          mkdir -p "$TOOL_ROOT/szs" "$TOOL_ROOT/wit" "$TOOL_ROOT/ffmpeg" "$TOOL_ROOT/mpv"

          curl -fL --retry 3 "https://szs.wiimm.de/download/szs-v2.42a-r8989-mac64.tar.gz" -o "$RUNNER_TEMP/szs.tar.gz"
          tar -xzf "$RUNNER_TEMP/szs.tar.gz" -C "$TOOL_ROOT/szs"

          curl -fL --retry 3 "https://wit.wiimm.de/download/wit-v3.05a-r8638-mac.tar.gz" -o "$RUNNER_TEMP/wit.tar.gz"
          tar -xzf "$RUNNER_TEMP/wit.tar.gz" -C "$TOOL_ROOT/wit"

          curl -fL --retry 3 "https://github.com/binmgr/ffmpeg/releases/latest/download/ffmpeg-darwin-arm64.tar.gz" -o "$RUNNER_TEMP/ffmpeg-darwin-arm64.tar.gz"
          curl -fL --retry 3 "https://github.com/binmgr/ffmpeg/releases/latest/download/SHA256SUMS.txt" -o "$RUNNER_TEMP/ffmpeg-SHA256SUMS.txt"
          grep 'ffmpeg-darwin-arm64.tar.gz' "$RUNNER_TEMP/ffmpeg-SHA256SUMS.txt" | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          tar -xzf "$RUNNER_TEMP/ffmpeg-darwin-arm64.tar.gz" -C "$TOOL_ROOT/ffmpeg" ffmpeg ffprobe

          curl -fL --retry 3 "https://laboratory.stolendata.net/~djinn/mpv_osx/mpv-arm64-latest.tar.gz" -o "$RUNNER_TEMP/mpv-arm64.tar.gz"
          echo "3170fb709defebaba33e9755297d70dc3562220541de54fc3d494a8309ef1260  $RUNNER_TEMP/mpv-arm64.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/mpv-arm64.tar.gz" -C "$TOOL_ROOT/mpv"

          WLECT="$(find "$TOOL_ROOT/szs" -type f -name wlect -print -quit)"
          WIT="$(find "$TOOL_ROOT/wit" -type f -name wit -print -quit)"
          test -n "$WLECT"
          test -n "$WIT"
          test -x "$WLECT"
          test -x "$WIT"
          file "$WLECT" "$WIT" "$TOOL_ROOT/ffmpeg/ffmpeg" "$TOOL_ROOT/mpv"/*/Contents/MacOS/mpv 2>/dev/null || true
          "$WLECT" --version
          "$WIT" --version

          cat > "$TOOL_ROOT/THIRD_PARTY_NOTICES.txt" <<'NOTICE'
          CTDM includes third-party command-line tools for a self-contained macOS experience.
          Wiimms SZS Toolset v2.42a: https://szs.wiimm.de/ (source/downloads and licensing)
          Wiimms ISO Tools v3.05a: https://wit.wiimm.de/ (source/downloads and licensing)
          FFmpeg: https://github.com/binmgr/ffmpeg (static builds; GPL-2.0-or-later due to included components)
          mpv: https://mpv.io/ (source and licensing)
          NOTICE

      - name: Sign bundled command-line tools and final app bundle
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          set -euo pipefail
          TOOL_ROOT="$APP_PATH/Contents/Resources/CTDM-tools"

          # Sign loose Mach-O helpers individually first. --deep can rewrite
          # nested code signatures and is not appropriate for these loose tools.
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              echo "Signing bundled tool: $candidate"
              codesign --force --sign - "$candidate"
            fi
          done < <(find "$TOOL_ROOT" -type f -print0)

          # Xcode already signed the Flutter frameworks; sign only the outer
          # app so the command-line tools' just-created signatures are kept.
          codesign --force --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Verify signatures and launch bundled tools
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          set -euo pipefail
          TOOL_ROOT="$APP_PATH/Contents/Resources/CTDM-tools"

          # Verify every Mach-O file under the embedded tool directory after
          # signing the outer app. This catches nested code whose signature
          # was accidentally changed by a later packaging step.
          MACHO_COUNT=0
          while IFS= read -r -d '' candidate; do
            if file "$candidate" | grep -q 'Mach-O'; then
              echo "Verifying signature: $candidate"
              codesign --verify --strict --verbose=2 "$candidate"
              MACHO_COUNT=$((MACHO_COUNT + 1))
            fi
          done < <(find "$TOOL_ROOT" -type f -print0)
          test "$MACHO_COUNT" -gt 0
          echo "Verified $MACHO_COUNT bundled Mach-O files."

          find_tool() {
            find "$TOOL_ROOT" \( -type f -o -type l \) -name "$1" -print -quit
          }

          WIT="$(find_tool wit)"
          WLECT="$(find_tool wlect)"
          FFmpeg="$(find_tool ffmpeg)"
          FFPROBE="$(find_tool ffprobe)"
          test -n "$WIT"
          test -n "$WLECT"
          test -n "$FFmpeg"
          test -n "$FFPROBE"

          "$WIT" --version
          "$WLECT" --version
          "$FFmpeg" -version >/dev/null
          "$FFPROBE" -version >/dev/null
          echo "WIT, WLECT, FFmpeg and FFprobe all launch after final signing."

      - name: Verify release is not App-Sandboxed
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          set -euo pipefail
          codesign -d --entitlements :- "$APP_PATH" > "$RUNNER_TEMP/app-entitlements.txt" 2>&1 || true
          if grep -q 'com.apple.security.app-sandbox' "$RUNNER_TEMP/app-entitlements.txt"; then
            echo "Release bundle still has App Sandbox enabled; embedded WIT needs normal access to the user-selected ISO/workspace."
            cat "$RUNNER_TEMP/app-entitlements.txt"
            exit 1
          fi

      - name: Smoke-test app startup
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          set -euo pipefail
          echo "Launching $APP_PATH"
          open -n "$APP_PATH"
          sleep 8
          if ! pgrep -x ctdm >/dev/null; then
            echo "The app exited during startup. Recent macOS crash reports:"
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f -mmin -5 -print 2>/dev/null || true
            exit 1
          fi
          APP_PID="$(pgrep -n -x ctdm)"
          kill "$APP_PID" || true

      - name: Package app as ZIP and DMG
        env:
          APP_PATH: ${{ steps.app.outputs.app_path }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" MKW-Distribution-Maker-macOS-arm64.zip
          hdiutil create -volname "MKW Distribution Maker" -srcfolder "$APP_PATH" -ov -format UDZO MKW-Distribution-Maker-macOS-arm64.dmg
          shasum -a 256 MKW-Distribution-Maker-macOS-arm64.zip MKW-Distribution-Maker-macOS-arm64.dmg
          du -sh "$APP_PATH" MKW-Distribution-Maker-macOS-arm64.zip MKW-Distribution-Maker-macOS-arm64.dmg

      - name: Upload macOS app packages
        uses: actions/upload-artifact@v4
        with:
          name: MKW-Distribution-Maker-macOS-arm64
          path: |
            MKW-Distribution-Maker-macOS-arm64.zip
            MKW-Distribution-Maker-macOS-arm64.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Move rolling Nightly tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/mkw-distribution-maker-nightly';
            try {
              await github.rest.git.getRef({ owner: context.repo.owner, repo: context.repo.repo, ref });
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha: context.sha,
                force: true
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'refs/' + ref,
                sha: context.sha
              });
            }

      - name: Publish rolling Nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mkw-distribution-maker-nightly
          name: Nightly
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            MKW-Distribution-Maker-macOS-arm64.zip
            MKW-Distribution-Maker-macOS-arm64.dmg

